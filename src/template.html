<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
  </head>
  <body>
    <aside>
      <ul class="nav">
        <li class="nav-btn-wrapper">
          <button class="nav-btn">New Task</button>
        </li>
        <li class="nav-btn-wrapper">
          <button class="nav-btn">New Project</button>
        </li>
        <li id="project-nav">
          Projects
          <button id="new-project-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <title>plus</title>
              <path
                d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z"
                fill="currentColor"
              />
            </svg>
          </button>
        </li>
        <li id="my-projects-wrapper">
          <!-- Projects render here -->
          <ul class="my-projects"></ul>
        </li>
      </ul>
    </aside>
    <main>
      <!-- Project renders here -->
      <header class="project-info"></header>
      <article class="project-tasks"></article>
    </main>
  </body>
</html>
